# Спільні налаштування для всіх процесів, що запускаються з образу core_api
# (API, слухач оновлень цін, Celery worker і beat). Підключаються через <<: *core-app
x-core-app: &core-app
  build: ./services/core_api
  image: price-tracker/core_api:dev
  restart: unless-stopped
  networks:
    - tracker-network
  volumes:
    - ./services/core_api:/app
    # Модель ембеддингів не завантажується заново після перестворення контейнера
    - fastembed_cache:/models
  env_file:
    - .env
  environment:
    EMBEDDING_CACHE_DIR: /models
  depends_on:
    - db
    - redis
    - rabbitmq

networks:
  tracker-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  fastembed_cache:
  prometheus_data:
  grafana_data:

services:
  # 1. База даних PostgreSQL з підтримкою векторів (pgvector)
  db:
    image: pgvector/pgvector:pg16
    container_name: tracker_postgres
    restart: unless-stopped
    networks:
      - tracker-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. In-memory кеш Redis
  redis:
    image: redis:7-alpine
    container_name: tracker_redis
    restart: unless-stopped
    networks:
      - tracker-network
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  # 3. Брокер повідомлень RabbitMQ з вебінтерфейсом
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tracker_rabbitmq
    restart: unless-stopped
    networks:
      - tracker-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"

  # 4. Головний API-сервіс (Core API)
  core_api:
    <<: *core-app
    container_name: tracker_core_api
    ports:
      - "${CORE_API_PORT}:8000"

  # 4.1 Слухач подій оновлення цін (пише current_price у БД)
  price_consumer:
    <<: *core-app
    container_name: tracker_price_consumer
    command: ["python", "-m", "app.services.price_consumer"]

  # 4.2 Celery worker: виконує фонові задачі. Без container_name, щоб можна було
  # масштабувати: docker compose up -d --scale celery_worker=3
  celery_worker:
    <<: *core-app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  # 4.3 Celery beat: розклад задач. Завжди рівно ОДИН екземпляр, інакше задачі дублюються
  celery_beat:
    <<: *core-app
    container_name: tracker_celery_beat
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]

  # 5. Сервіс збору та моніторингу цін
  scraper_service:
    build: ./services/scraper_service
    container_name: tracker_scraper_service
    restart: unless-stopped
    networks:
      - tracker-network
    volumes:
      - ./services/scraper_service:/app
    ports:
      - "${SCRAPER_PORT}:8001"
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  # 6. Сервіс сповіщень
  notifier_service:
    build: ./services/notifier_service
    container_name: tracker_notifier_service
    restart: unless-stopped
    networks:
      - tracker-network
    volumes:
      - ./services/notifier_service:/app
    ports:
      - "${NOTIFIER_PORT}:8002"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis

  # 7. Prometheus: збирає метрики з усіх сервісів і RabbitMQ
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tracker_prometheus
    restart: unless-stopped
    networks:
      - tracker-network
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # 8. Grafana: дашборд і datasource підключаються автоматично (provisioning)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tracker_grafana
    restart: unless-stopped
    networks:
      - tracker-network
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
