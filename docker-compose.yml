# Базова конфігурація: образи запускаються так, як у продакшені
# (код усередині образу, без --reload). Для розробки поверх неї автоматично
# підключається docker-compose.override.yml. Запуск без dev-налаштувань:
#   docker compose -f docker-compose.yml up -d

# Перевірка «сервіс відповідає на /health» без curl в образі
x-http-healthcheck: &http-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

# Спільні налаштування для всіх процесів, що запускаються з образу core_api
# (міграції, API, слухач оновлень цін, Celery worker і beat)
x-core-app: &core-app
  build: ./services/core_api
  image: price-tracker/core_api:dev
  restart: unless-stopped
  networks:
    - tracker-network
  volumes:
    # Модель ембеддингів не завантажується заново після перестворення контейнера
    - fastembed_cache:/models
  env_file:
    - .env
  environment:
    EMBEDDING_CACHE_DIR: /models
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

networks:
  tracker-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  fastembed_cache:
  prometheus_data:
  grafana_data:

services:
  # 1. База даних PostgreSQL з підтримкою векторів (pgvector)
  db:
    image: pgvector/pgvector:pg16
    container_name: tracker_postgres
    restart: unless-stopped
    networks:
      - tracker-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis: кеш, rate limiting, result backend Celery
  redis:
    image: redis:7-alpine
    container_name: tracker_redis
    restart: unless-stopped
    networks:
      - tracker-network
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Брокер повідомлень RabbitMQ з вебінтерфейсом
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tracker_rabbitmq
    restart: unless-stopped
    networks:
      - tracker-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      # ping лише перевіряє, що вузол живий; check_port_connectivity — що AMQP-порт
      # уже приймає з'єднання (інакше сервіси стартують раніше і падають)
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # 4. Міграції БД: виконуються один раз перед стартом сервісів core_api
  migrate:
    <<: *core-app
    container_name: tracker_migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  # 5. Головний API-сервіс (Core API)
  core_api:
    <<: *core-app
    container_name: tracker_core_api
    ports:
      - "${CORE_API_PORT}:8000"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]

  # 5.1 Слухач подій оновлення цін (пише current_price у БД)
  price_consumer:
    <<: *core-app
    container_name: tracker_price_consumer
    command: ["python", "-m", "app.services.price_consumer"]
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=3)"]

  # 5.2 Celery worker: виконує фонові задачі. Без container_name, щоб можна було
  # масштабувати: docker compose up -d --scale celery_worker=3
  celery_worker:
    <<: *core-app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  # 5.3 Celery beat: розклад задач. Завжди рівно ОДИН екземпляр, інакше задачі дублюються
  celery_beat:
    <<: *core-app
    container_name: tracker_celery_beat
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]

  # 6. Сервіс збору та моніторингу цін
  scraper_service:
    build: ./services/scraper_service
    container_name: tracker_scraper_service
    restart: unless-stopped
    networks:
      - tracker-network
    ports:
      - "${SCRAPER_PORT}:8001"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]

  # 7. Сервіс сповіщень
  notifier_service:
    build: ./services/notifier_service
    container_name: tracker_notifier_service
    restart: unless-stopped
    networks:
      - tracker-network
    ports:
      - "${NOTIFIER_PORT}:8002"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]

  # 8. Prometheus: збирає метрики з усіх сервісів і RabbitMQ
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tracker_prometheus
    restart: unless-stopped
    networks:
      - tracker-network
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # 9. Grafana: дашборд і datasource підключаються автоматично (provisioning)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tracker_grafana
    restart: unless-stopped
    networks:
      - tracker-network
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
