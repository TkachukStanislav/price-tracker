# Prometheus кожні 15 секунд забирає GET /metrics з кожного сервісу
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: core_api
    static_configs:
      - targets: ["core_api:8000"]

  - job_name: price_consumer
    static_configs:
      - targets: ["price_consumer:9100"]

  - job_name: scraper_service
    static_configs:
      - targets: ["scraper_service:8001"]

  - job_name: notifier_service
    static_configs:
      - targets: ["notifier_service:8002"]

  # Вбудований плагін rabbitmq_prometheus; per-object дає метрики по кожній черзі
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
