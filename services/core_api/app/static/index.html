<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Tracker AI Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#6366f1',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
          ⚡
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
          Price Tracker <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">AI pgvector</span>
        </span>
      </div>
      <div id="auth-status" class="flex items-center space-x-3">
        <!-- Auth buttons or user info will render here -->
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    
    <!-- AI Notification Banner -->
    <div id="ai-alert" class="hidden mb-6 p-4 rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-200 flex items-start space-x-3 transition-all">
      <span class="text-xl">🤖</span>
      <div>
        <h4 class="font-semibold text-amber-300">AI Semantic Match Detected</h4>
        <p id="ai-alert-message" class="text-sm mt-0.5 text-slate-300"></p>
      </div>
    </div>

    <!-- Login/Register View (shown when logged out) -->
    <section id="auth-panel" class="max-w-md mx-auto my-12 p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
      <h2 class="text-2xl font-bold mb-2 text-center">Welcome Back</h2>
      <p class="text-sm text-slate-400 mb-6 text-center">Log in to view and track items in real time</p>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm shadow-lg shadow-indigo-600/30 transition">
          Sign In
        </button>
      </form>
    </section>

    <!-- Main Dashboard (shown when logged in) -->
    <div id="dashboard-panel" class="hidden space-y-8">
      
      <!-- Add Item Card -->
      <section class="p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm">
        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
          <span>Track New Product</span>
          <span class="text-xs font-normal text-slate-400">(Vector embedding generated on submission)</span>
        </h3>
        <form id="add-item-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="md:col-span-2">
            <input type="text" id="item-title" placeholder="Product Title (e.g. Apple iPhone 15 Pro 128GB)" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <input type="text" id="item-url" placeholder="Store URL" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div class="flex gap-2">
            <input type="number" step="0.01" id="item-target-price" placeholder="Target $" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shrink-0 shadow-md shadow-indigo-600/20">
              Track
            </button>
          </div>
        </form>
      </section>

      <!-- Items List -->
      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Tracked Products</h3>
          <button id="refresh-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            🔄 Refresh
          </button>
        </div>

        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Item Cards rendered via JS -->
        </div>
      </section>

    </div>
  </main>

  <script>
    let token = localStorage.getItem('token');

    // UI Element references
    const authPanel = document.getElementById('auth-panel');
    const dashboardPanel = document.getElementById('dashboard-panel');
    const authStatus = document.getElementById('auth-status');
    const itemsGrid = document.getElementById('items-grid');
    const aiAlert = document.getElementById('ai-alert');
    const aiAlertMessage = document.getElementById('ai-alert-message');

    function checkAuth() {
      if (token) {
        authPanel.classList.add('hidden');
        dashboardPanel.classList.remove('hidden');
        authStatus.innerHTML = `
          <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-red-500/20 hover:text-red-300 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            Sign Out
          </button>
        `;
        loadItems();
      } else {
        authPanel.classList.remove('hidden');
        dashboardPanel.classList.add('hidden');
        authStatus.innerHTML = '';
      }
    }

    // Login Form Submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (!res.ok) throw new Error('Login failed');
        const data = await res.json();
        token = data.access_token;
        localStorage.setItem('token', token);
        checkAuth();
      } catch (err) {
        alert('Authentication failed: ' + err.message);
      }
    });

    function logout() {
      localStorage.removeItem('token');
      token = null;
      checkAuth();
    }

    // Fetch and render items
    async function loadItems() {
      try {
        const res = await fetch('/api/v1/items/', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) return logout();
        const items = await res.json();
        
        itemsGrid.innerHTML = '';
        if (items.length === 0) {
          itemsGrid.innerHTML = '<p class="text-sm text-slate-500 col-span-3">No products tracked yet. Add your first item above.</p>';
          return;
        }

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = "p-5 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition space-y-3";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <h4 class="font-medium text-slate-100 text-sm leading-snug line-clamp-2">${item.title}</h4>
              <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">
                $${item.target_price}
              </span>
            </div>
            <p class="text-xs text-slate-400 truncate">${item.ticker_or_url}</p>
            <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
              <span>ID: #${item.id}</span>
              <span class="text-indigo-400">Embedding Stored ✓</span>
            </div>
          `;
          itemsGrid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Add new item
    document.getElementById('add-item-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('item-title').value;
      const url = document.getElementById('item-url').value;
      const target_price = parseFloat(document.getElementById('item-target-price').value);

      try {
        const res = await fetch('/api/v1/items/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            title: title,
            ticker_or_url: url,
            target_price: target_price
          })
        });

        if (!res.ok) throw new Error('Failed to create item');
        const newItem = await res.json();

        // Clear inputs and reload list
        document.getElementById('item-title').value = '';
        document.getElementById('item-url').value = '';
        document.getElementById('item-target-price').value = '';
        loadItems();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    document.getElementById('refresh-btn').addEventListener('click', loadItems);

    // Initial check
    checkAuth();
  </script>
</body>
</html>
