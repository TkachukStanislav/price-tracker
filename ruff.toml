# Спільні налаштування ruff для всіх сервісів (локально, у pre-commit і CI)
target-version = "py311"
line-length = 88

[lint]
# Правила за замовчуванням + сортування імпортів
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[lint.isort]
# Кожен сервіс має пакет app: це «наш» код, а не стороння бібліотека
known-first-party = ["app"]
