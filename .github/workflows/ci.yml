name: CI Pipeline

# Запускати перевірку при пуші в гілку main або при створенні Pull Request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Клонуємо код проєкту на віртуальну машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Крок 2: Розгортаємо чистий Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Крок 3: Встановлюємо залежності для тестів
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-env httpx fastembed numpy fastapi pydantic-settings email-validator python-jose[cryptography] passlib[bcrypt] bcrypt aio-pika asyncpg python-multipart

      # Крок 4: Запускаємо тести з робочої папки сервісу
      - name: Run Pytest
        working-directory: services/core_api
        run: |
          pytest tests/ -v