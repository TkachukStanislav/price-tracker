name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ================= CI: ТЕСТУВАННЯ =================
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/core_api/requirements.txt
          pip install pytest pytest-asyncio pytest-env httpx greenlet

      - name: Run Pytest
        working-directory: services/core_api
        run: |
          pytest tests/ -v

  # ================= CD: ЗБІРКА ВСІХ СЕРВІСІВ =================
  build-images:
    name: Build Docker Images
    needs: test # Запускається ТІЛЬКИ якщо тести були зелені
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core_api, notifier_service, scraper_service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false # Поки що просто перевіряємо валідність збірки (без відправки в реєстр)
